<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>AcmeCorp — Invoice Approval (FlowLens demo)</title>
  <style>
    * { box-sizing: border-box; margin: 0; }
    body { font-family: system-ui, -apple-system, sans-serif; background: #f3f5f8; color: #1c2733; }
    header { background: #14243a; color: #fff; padding: 14px 24px; display: flex; align-items: center; gap: 12px; }
    header h1 { font-size: 16px; font-weight: 600; }
    header .badge { font-size: 11px; background: #2f80ed; padding: 3px 8px; border-radius: 10px; }
    main { max-width: 860px; margin: 24px auto; padding: 0 16px; }
    .card { background: #fff; border: 1px solid #dde3ea; border-radius: 10px; padding: 20px; margin-bottom: 16px; }
    h2 { font-size: 18px; margin-bottom: 12px; }
    table { width: 100%; border-collapse: collapse; font-size: 14px; }
    th, td { text-align: left; padding: 10px 8px; border-bottom: 1px solid #eef1f5; }
    tr.row-invoice { cursor: pointer; }
    tr.row-invoice:hover { background: #f5f9ff; }
    .status { font-size: 12px; padding: 2px 8px; border-radius: 10px; background: #fff3d6; color: #8a6100; }
    .status.done { background: #dcf5e4; color: #12703a; }
    button { font: inherit; padding: 9px 16px; border-radius: 8px; border: 1px solid #c9d2dd; background: #fff; cursor: pointer; }
    button.primary { background: #2f80ed; border-color: #2f80ed; color: #fff; }
    button.danger { background: #fff; border-color: #e05555; color: #c53030; }
    button.primary.blocked { opacity: 0.94; } /* deliberately looks active while it isn't */
    .actions { display: flex; gap: 10px; margin-top: 16px; }
    .meta { display: grid; grid-template-columns: repeat(3, 1fr); gap: 12px; margin-bottom: 14px; font-size: 14px; }
    .meta div span { display: block; color: #6b7a8c; font-size: 12px; }
    label.check { display: flex; gap: 8px; align-items: center; font-size: 13px; color: #4a5a6b; margin-top: 14px; }
    textarea { width: 100%; min-height: 90px; margin-top: 10px; padding: 10px; border: 1px solid #c9d2dd; border-radius: 8px; font: inherit; }
    .hint { font-size: 12px; color: #97a4b3; margin-top: 6px; }
    .pdf { background: #eceff4; border: 1px dashed #b9c4d0; border-radius: 8px; padding: 28px; text-align: center; color: #6b7a8c; margin-top: 12px; font-size: 13px; }
    .shake { animation: shake 0.3s; }
    @keyframes shake { 25% { transform: translateX(-4px); } 75% { transform: translateX(4px); } }
    .toast { position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); background: #14243a; color: #fff; padding: 10px 18px; border-radius: 8px; font-size: 13px; opacity: 0; transition: opacity .3s; pointer-events: none; }
    .toast.show { opacity: 1; }
    a.back { color: #2f80ed; font-size: 13px; text-decoration: none; display: inline-block; margin-bottom: 12px; }
  </style>
</head>
<body>
  <header>
    <h1>AcmeCorp · Invoice Approval</h1>
    <span class="badge">FlowLens demo app</span>
  </header>
  <main id="view"></main>
  <div class="toast" id="toast"></div>

  <script src="../tracker/flowlens.js"></script>
  <script src="app.js"></script>
</body>
</html>
