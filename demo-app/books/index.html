<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>LedgerPro — Bookkeeping</title>
  <!-- NOTE: this app has NO FlowLens tracker installed and no data-flowlens
       annotations. It simulates "random third-party bookkeeping software"
       and is only observable through the FlowLens browser extension. -->
  <style>
    * { box-sizing: border-box; margin: 0; }
    body { font-family: Georgia, 'Times New Roman', serif; background: #f6f4ef; color: #2d2a24; }
    header { background: #274634; color: #f3efe6; padding: 14px 26px; display: flex; align-items: baseline; gap: 18px; }
    header h1 { font-size: 18px; letter-spacing: 0.5px; }
    header nav a { color: #cfe0d4; margin-right: 14px; text-decoration: none; font-size: 14px; }
    header nav a.active { color: #fff; border-bottom: 2px solid #8fb89e; }
    main { max-width: 780px; margin: 26px auto; padding: 0 16px; }
    .sheet { background: #fffdf8; border: 1px solid #ddd6c6; border-radius: 6px; padding: 22px; margin-bottom: 16px; }
    h2 { font-size: 17px; margin-bottom: 14px; color: #274634; }
    table { width: 100%; border-collapse: collapse; font-size: 14px; }
    th, td { text-align: left; padding: 8px 6px; border-bottom: 1px solid #eee7d6; }
    th { font-size: 12px; color: #6d6754; text-transform: uppercase; letter-spacing: 0.5px; }
    td.amount { text-align: right; font-variant-numeric: tabular-nums; }
    button { font-family: inherit; font-size: 14px; padding: 8px 16px; border-radius: 4px; border: 1px solid #274634; background: #fffdf8; color: #274634; cursor: pointer; }
    button.solid { background: #274634; color: #fff; }
    label { display: block; font-size: 13px; color: #6d6754; margin: 12px 0 4px; }
    input, select, textarea { width: 100%; padding: 8px; border: 1px solid #cfc7b2; border-radius: 4px; font-family: inherit; font-size: 14px; background: #fff; }
    .row2 { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
    .posted { text-align: center; padding: 36px 20px; }
    .posted .big { font-size: 20px; color: #274634; margin-bottom: 8px; }
    .muted { color: #6d6754; font-size: 13px; }
    .toolbar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 14px; }
  </style>
</head>
<body>
  <header>
    <h1>LedgerPro</h1>
    <nav>
      <a href="#/journal" id="nav-journal">Journal</a>
      <a href="#/accounts" id="nav-accounts">Chart of accounts</a>
    </nav>
  </header>
  <main id="view"></main>
  <script src="app.js"></script>
</body>
</html>
